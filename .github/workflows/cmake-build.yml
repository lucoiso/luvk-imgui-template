name: Build & Upload

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # Windows only: the template links luvk::app (SDL3 + ImGui), which luvk's own CI
  # also builds on Windows only.
  build:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Setup CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: 2.1 Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      # 'release' preset (template only, warnings as errors) with the static MSVC runtime,
      # so the published executable runs without the VC++ redistributable.
      - name: 3. CMake Configure
        run: cmake --preset release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: 4. CMake Build
        run: cmake --build --preset release

      - name: 5. Stage Runtime Files
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/release/bin/. dist/
          cp LICENSE README.md dist/
          ls -la dist

      - name: 6. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows
          path: ./dist

  upload:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-windows
          path: ./artifacts/binary-windows

      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Package Binaries (Clean)
        run: cd artifacts/binary-windows && zip -r ../../windows-x64.zip . && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.vars.outputs.sha_short }}
          name: Build ${{ steps.vars.outputs.sha_short }}
          draft: false
          prerelease: false
          files: windows-x64.zip
